# XPlaneTruthCapture runtime config.
# Values are read when capture starts.

# every_frame, 30hz, or 10hz
capture_rate = every_frame

# Maximum number of elements recorded for array datarefs.
max_array_values = 32

# Keep true unless you want to capture only paths from config/datarefs.txt.
include_default_datarefs = true

# Show a small recording overlay while capture is active.
overlay_enabled = true
overlay_x = 24
overlay_y_from_top = 48
